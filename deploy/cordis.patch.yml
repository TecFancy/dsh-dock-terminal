# Deployment-side configuration template for dsh-dock-terminal.
#
# Copy the relevant snippet into the USER layer of a profile that mounts the
# plugin ($DSH_HOME/cordis.patch.yml or <profile>/cordis.patch.yml). The bundle
# patch layer (repo root cordis.patch.yml) is deliberately config-free: the
# deploy-time override belongs here, where it can differ per environment.
#
# Patch semantics (current dsh): an id-targeted patch REPLACES the target
# row's whole `config` value - restate every key the row needs, not just the
# changed one. Layer order on boot: bundle layers (base, then each installed
# bundle in list order), the profile's cordis.patch.yml, the home-level
# $DSH_HOME/cordis.patch.yml, then each --patch overlay; later layers win per
# row. There is no `set:` wrapper: the row below is the complete patch form.
#
# Example - pin the shell and raise the per-conversation cap:

- id: dsh-dock-terminal
  config:
    shell: "/bin/zsh"
    shellArgs: ["-l"]
    maxPerSession: 3
    reconnectGraceMs: 60000
